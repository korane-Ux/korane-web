    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #DB745A;
      }
      #root {
        display: flex;
        height: 100%;

    <!-- Écran de chargement affiché avant le JavaScript ; l'appli le retire quand elle est prête (app/_layout.tsx). -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #DB745A; transition: opacity 300ms ease;
      }
      #boot img { width: min(42vw, 220px); height: auto; animation: boot-pulse 1.6s ease-in-out infinite; }
      #boot .dots { display: flex; gap: 10px; }
      #boot .dots span {
        width: 12px; height: 12px; border-radius: 50%;
        background: #FBEEE2; border: 2px solid #632D45;
        animation: boot-hop 1s ease-in-out infinite;
      }
      #boot .dots span:nth-child(2) { animation-delay: 0.15s; }
      #boot .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-pulse { 50% { transform: scale(1.04); } }
      @keyframes boot-hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
      @media (prefers-reduced-motion: reduce) { #boot img, #boot .dots span { animation: none; } }
    </style>
